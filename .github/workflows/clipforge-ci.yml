name: ClipForge CI
on:
  push:
    branches: [clipforge-ai]
  pull_request:
    branches: [clipforge-ai]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend
        run: python -m py_compile clipforge/backend/app.py
      - name: Build Docker image
        run: docker build -t clipforge-ai -f clipforge/backend/Dockerfile clipforge/backend
