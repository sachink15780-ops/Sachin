<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipForge AI</title><style>*{box-sizing:border-box}body{margin:0;background:#0c0d14;color:#f5f5fa;font:16px system-ui}main{max-width:980px;margin:auto;padding:24px}.top{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800}.logo{background:linear-gradient(135deg,#9d5cff,#28c8ff);padding:9px;border-radius:12px}.sub{color:#9fa3b8;margin:12px 0 28px}.panel{background:#171925;border:1px solid #292d40;border-radius:18px;padding:20px;margin:16px 0}.tabs{display:flex;gap:10px}.tabs button,button{background:#282b3c;color:white;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}.tabs button.active,button.primary{background:linear-gradient(90deg,#8d50ff,#35b8ff)}input,select{width:100%;padding:14px;background:#10121c;color:#fff;border:1px solid #32364b;border-radius:10px;margin:10px 0}label{color:#c5c7d5}button{font-weight:700}.row{display:flex;gap:12px;align-items:center}.row>*{flex:1}.hide{display:none}.status{margin:14px 0;color:#b8c0df}.clip{border:1px solid #30344a;border-radius:12px;padding:14px;margin:10px 0}.clip a{color:#78caff}.bar{height:8px;background:#2c3043;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#8d50ff,#35b8ff);width:0}@media(max-width:600px){main{padding:15px}.row{flex-direction:column}.row>*{width:100%}}</style></head>
<body><main><div class="top"><span class="logo">✂</span> ClipForge AI</div><div class="sub">Turn long videos into short vertical highlights.</div>
<div class="panel"><div class="tabs"><button id="uploadTab" class="active" onclick="mode('upload')">Upload video</button><button id="urlTab" onclick="mode('url')">YouTube link</button></div><form id="form"><div id="fileBox"><label>Select a video (MP4, MOV, MKV, WEBM)</label><input type="file" id="video" accept="video/*" required></div><div id="urlBox" class="hide"><label>YouTube video URL</label><input id="yturl" type="url" placeholder="https://youtube.com/watch?v=..."></div><div class="row"><div><label>Number of clips</label><select id="count"><option>3</option><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div><div><label>Clip length</label><select id="length"><option value="15">15 seconds</option><option value="30" selected>30 seconds</option><option value="45">45 seconds</option><option value="60">60 seconds</option></select></div></div><button class="primary" type="submit">Find highlights ✨</button></form><div class="status" id="status"></div><div class="bar"><span id="progress"></span></div></div><section id="results"></section></main>
<script>let selected='upload',activeJob=null;function mode(m){selected=m;document.getElementById('fileBox').classList.toggle('hide',m!=='upload');document.getElementById('urlBox').classList.toggle('hide',m!=='url');document.getElementById('video').required=m==='upload';document.getElementById('yturl').required=m==='url';document.getElementById('uploadTab').classList.toggle('active',m==='upload');document.getElementById('urlTab').classList.toggle('active',m==='url')}const status=document.getElementById('status'),progress=document.getElementById('progress'),results=document.getElementById('results');document.getElementById('form').onsubmit=async e=>{e.preventDefault();results.innerHTML='';status.textContent='Uploading / preparing source…';let fd=new FormData();fd.append('count',document.getElementById('count').value);fd.append('clip_len',document.getElementById('length').value);let endpoint;if(selected==='upload'){fd.append('file',document.getElementById('video').files[0]);endpoint='/api/process/upload'}else{fd.append('url',document.getElementById('yturl').value);endpoint='/api/process/url'}try{let r=await fetch(endpoint,{method:'POST',body:fd});let data=await r.json();if(!r.ok)throw Error(data.detail||'Request failed');activeJob=data.job_id;poll()}catch(err){status.textContent='Error: '+err.message}};async function poll(){if(!activeJob)return;try{let r=await fetch('/api/jobs/'+activeJob);let j=await r.json();status.textContent=j.message;progress.style.width=(j.progress||0)+'%';if(j.status==='done'){status.textContent='Ready! '+j.clips.length+' clips created.';results.innerHTML='<p><a href="/api/jobs/'+activeJob+'/zip" download>Download all clips (ZIP)</a></p>'+j.clips.map(c=>'<div class="clip"><b>Clip '+c.index+' · Score '+c.score+'</b><p>'+escapeHtml(c.title)+'</p><video controls style="width:100%;max-height:420px" src="'+c.url+'"></video><p><a href="'+c.url+'" download>Download MP4</a></p><small>'+c.start+'s → '+c.end+'s</small></div>').join('');return}if(j.status==='error'){status.textContent='Failed: '+j.message;return}setTimeout(poll,2500)}catch(e){status.textContent='Status error: '+e.message}}function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
