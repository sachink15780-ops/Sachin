function val(id){return ($('#'+id)?.value||'').trim()}function runTool(){let s='';const idea=val('idea'),aud=val('aud'),topic=val('topic')||idea||val('niche')||val('channel');switch(current){

s='COMPLETE HINDI VIDEO PACKAGE\nTopic: '+topic+'\nAudience: '+audience+'\nRequested length: '+duration+'\n\n1) HOOK OPTIONS\n'+hooks.map((h,i)=>(i+1)+'. '+h).join('\n')+'\n\n2) FULL HINDI VOICEOVER SCRIPT\n\n[0:00–0:18 | HOOK]\nAap YouTube par videos upload kar rahe hain, lekin subscribers dheere badh rahe hain? Toh sirf upload ki quantity badhane se pehle apna system check kijiye. Is video mein hum paanch practical steps dekhenge—audience, topic, title-thumbnail, opening aur analytics. Inhe apply karne se aapko pata chalega ki agla video kis tarah behtar banana hai. 1000 subscribers ki guarantee koi nahi de sakta, lekin ye process aapko random uploading se bachayega.\n\n[0:18–0:48 | INTRO]\nSabse pehle ek baat samajhiye: viewer subscribe tab karta hai jab use lagta hai ki aapke channel par use baar-baar useful content milega. Isliye har video ko alag experiment ki tarah nahi, ek clear channel promise ka hissa banaiye. Chaliye step by step samajhte hain.\n\n[0:48–1:35 | STEP 1 — EK AUDIENCE CHUNIYE]\nPehla step hai ek specific audience choose karna. Maan lijiye aapka channel naye YouTubers ke liye hai. Toh aap channel setup, first Short, thumbnail banana, YouTube Studio aur beginner mistakes jaise related topics cover kar sakte hain. Lekin aaj gaming, kal cooking aur parson finance upload karenge, toh naye viewer ko samajh nahi aayega ki subscribe karne ke baad use kya milega. Agli paanch videos ek hi audience ki related problems par banaiye. Channel ke home page par un videos ki playlist banaiye aur har video ke end mein ek relevant next video suggest kijiye. Viewer ko subscribe karne ka real reason tab milta hai jab use pata ho ki aage bhi isi tarah ki help milegi.\n\n[1:35–2:22 | STEP 2 — REAL PROBLEM WALE TOPICS]\nDoosra step hai aise topics chunna jinhe aapki audience sach mein search ya discuss karti hai. YouTube search suggestions dekhiye, apne aur doosre relevant channels ke comments padhiye, aur baar-baar pooche ja rahe sawal note kijiye. Example: agar log pooch rahe hain ki mobile se thumbnail kaise banayein, toh ek complete beginner tutorial banaiye. Video record karne se pehle teen lines likhiye: viewer ki problem kya hai, aapka solution kya hai, aur video ke end tak viewer kya kar paayega. Kisi doosre creator ka title ya script copy mat kijiye; sawal ko apne examples aur apni explanation se solve kijiye. Ek video mein ek main problem rakhiye, taaki viewer ko clear answer mile.\n\n[2:22–3:08 | STEP 3 — TITLE AUR THUMBNAIL]\nTeesra step hai title aur thumbnail ko ek team ki tarah banana. Title topic aur benefit clearly bataye. Thumbnail par do se chaar short words aur ek clear visual rakhiye. Dono mein same sentence repeat karne ki zaroorat nahi. Misaal ke liye title ho sakta hai, “Mobile Se YouTube Thumbnail Kaise Banayein”; thumbnail par likh sakte hain “PHONE SE DESIGN”. Phone ki chhoti screen par thumbnail preview kijiye. Agar text padhna mushkil hai ya visual samajh nahi aa raha, toh use simple banaiye. Click paane ke liye aisa promise mat kijiye jo video mein deliver hi na ho. Trust ek click se zyada important hai.\n\n[3:08–3:55 | STEP 4 — SHURU KE 15 SECOND]\nChautha step hai video ki opening. Lambi greeting, logo animation aur unnecessary introduction se shuru mat kijiye. Pehle viewer ki problem boliye, phir result batayiye, aur turant pehla useful point dikhaiye. Example: “Aaj hum mobile par thumbnail banayenge; end tak aapke paas upload-ready design hoga.” Iske baad Canva ya jis tool ka tutorial hai, uska actual screen dikhaiye. Jo bol rahe hain wahi screen par dikhna chahiye. Agar aapka title paanch tips ka promise karta hai, toh opening ke baad un tips par jaldi aaiye. Har kuch seconds mein flashy effect zaroori nahi; clear audio, readable text aur useful demonstration zyada kaam aate hain.\n\n[3:55–4:42 | STEP 5 — ANALYTICS SE SEEKHIYE]\nPaanchva step hai YouTube Studio mein results dekhna. Impressions batate hain thumbnail kitni baar dikhaya gaya; click-through rate batata hai kitne logon ne click kiya; audience retention dikhata hai log video kitni der dekh rahe hain. Agar impressions hain lekin clicks kam hain, title aur thumbnail ko review kijiye. Agar log shuru mein hi ja rahe hain, opening ko concise kijiye aur title ka promise jaldi deliver kijiye. Sirf ek video ke numbers dekhkar final decision mat lijiye. Apne pichhle kuch videos ka pattern compare kijiye. Har upload ke baad ek hi improvement choose kijiye aur agle video mein test kijiye. Is tarah aap guess karne ke bajaye data aur viewer feedback se seekhenge.\n\n[4:42–5:00 | RECAP + CTA]\nToh yaad rakhiye: ek audience, unki real problem, clear title-thumbnail, direct opening aur regular improvement. Fake subscribers ya guaranteed growth ke chakkar mein mat padiye. Aapka channel kis topic par hai aur abhi aapka next milestone kya hai? Comment mein batayein. '+cta+'\n\n3) DETAILED SCENE-BY-SCENE VISUAL PLAN\n0:00–0:18 — Creator checks a slow-growing subscriber counter on phone; fast cuts of upload screen and analytics. Text: “Views hain, subscribers nahi?”\n0:18–0:48 — Show a simple channel promise card and five-step roadmap. Text: “Give viewers a reason to return”.\n0:48–1:35 — Arrange five related beginner-creator video cards into one playlist; fade out unrelated topics. Text: “One audience. Related videos.”\n1:35–2:22 — Show YouTube search suggestions as illustrative UI, viewer comments and a three-line topic outline. Text: “Solve one real problem”.\n2:22–3:08 — Compare cluttered and clean thumbnail examples; show title “Mobile Se YouTube Thumbnail Kaise Banayein” and thumbnail “PHONE SE DESIGN”.\n3:08–3:55 — Demonstrate a direct tutorial opening with screen recording, clear cursor movement and captions. Text: “Problem → Result → Demo”.\n3:55–4:42 — Show analytics labels for impressions, CTR and retention; mark any sample figures clearly as demo data. Text: “Measure. Learn. Improve.”\n4:42–5:00 — Five-point recap checklist and comment prompt; leave space for end-screen related video.\n\n4) EDITING, MUSIC & SFX\n• Use clean Hindi captions and highlight only key phrases.\n• Keep voice clear and music low; use licensed or original music only.\n• Cut pauses and repeated lines; use screen recordings when explaining a tool.\n• Use simple transitions, not effects that distract from the lesson.\n\n5) SEO PACKAGE\nTitle: YouTube पर 1000 Subscribers कैसे बढ़ाएं? Beginners के लिए 5 Practical Steps\nDescription: Naye YouTubers ke liye audience selection, useful video topics, title-thumbnail, strong opening aur YouTube Studio analytics ko simple Hindi mein samjhein. Is video ke steps ko apne channel par test karein.\nKeywords: YouTube par 1000 subscribers kaise badhaye, YouTube growth tips Hindi, beginner YouTuber tips, YouTube channel growth, Hindi creator\nHashtags: #YouTubeGrowth #YouTubeTips #HindiCreator\n\n6) THUMBNAIL TEXT\n• 1000 SUBSCRIBERS?\n• 5 PRACTICAL STEPS\n• GROW SMARTER\n\n7) SHORTS CUT (30–40 sec)\n“1000 subscribers chahiye? Sirf roz upload karne ke bajaye ye paanch cheezein kijiye: ek audience choose kijiye, unki real problems par videos banaiye, title aur thumbnail clear rakhiye, first 15 seconds mein seedha value dijiye, aur YouTube Studio mein CTR aur retention check karke next video improve kijiye. Fake shortcuts nahi—viewer ko subscribe karne ka real reason dijiye.”\n\nNOTE: This is a practical starter package, not a guarantee of views or subscribers.';
break}

case'viral':{let groups={};for(let line of val('rows').split('\n')){let p=line.split('|').map(x=>x.trim());if(p.length<3)continue;let n=Number(p[2].replace(/,/g,''));if(!Number.isFinite(n))continue;(groups[p[0]]??=[]).push({title:p[1],views:n})}s='CHANNEL-RELATIVE OUTLIERS\n';for(let [name,arr] of Object.entries(groups)){let sorted=arr.map(x=>x.views).sort((a,b)=>a-b),mid=sorted.length%2?sorted[(sorted.length-1)/2]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;s+='\n'+name+' · median '+mid.toLocaleString()+' views\n'+arr.sort((a,b)=>b.views-a.views).map(x=>x.title+' — '+x.views.toLocaleString()+' views ('+(mid? (x.views/mid).toFixed(2)+'× median':'n/a')+')').join('\n')}if(!Object.keys(groups).length)s='No valid rows found. Use: channel | video title | views. Add several videos per channel for a meaningful median.';break}
case'retention':{let rows=val('csv').split('\n').slice(1).map(x=>x.split(',')).filter(x=>x.length>=2).map(x=>({t:x[0],r:Number(x[1])})).filter(x=>Number.isFinite(x.r));if(!rows.length){s='Could not read retention rows. Use CSV columns time,retention with numeric retention values.';break}let first=rows[0],last=rows[rows.length-1],drops=rows.slice(1).map((x,i)=>({t:x.t,d:rows[i].r-x.r})).sort((a,b)=>b.d-a.d);s='RETENTION READ\nStarting retention: '+first.r+'%\nLast supplied retention: '+last.r+'%\nNet change: '+(last.r-first.r).toFixed(1)+' percentage points\nLargest sampled drop: '+(drops[0]?.d.toFixed(1)||0)+' points at '+(drops[0]?.t||'n/a')+'\n\nInterpretation: inspect the segment immediately before the largest drop. These findings are limited to the rows and sampling interval in your CSV.';break}

case'seo':{let k=val('keyword')||topic;s='DESCRIPTION DRAFT\n'+(topic||'This video')+' — a practical guide for creators who want clear, actionable steps.\n\nIn this video:\n• Understand the basics\n• Follow the steps with examples\n• Avoid common mistakes\n\nSubscribe for more creator tutorials.\n\nTAGS\n'+[k,'YouTube tips','creator tips','Hindi tutorial','YouTube growth'].filter(Boolean).join(', ')+'\n\nTARGET QUERIES\n1. '+k+' for beginners\n2. how to '+k+' step by step\n3. '+k+' Hindi tutorial\n\nEdit this draft to match the actual video; do not add claims the video does not cover.';break}
case'audit':s='CHANNEL AUDIT\nContext: '+(val('channel')||'Not supplied')+'\nUpload pattern: '+(val('uploads')||'Not supplied')+'\nMain issue: '+(val('problem')||'Not supplied')+'\n\nONE PRIORITY FIX\nFor the next three uploads, keep the audience and promise consistent. Make the first 10–15 seconds directly deliver the title/thumbnail promise, then review impressions, CTR and retention after enough data is available.\n\nThis is a qualitative starting point; connect no account and no analytics were fetched.';break}
if(current==='script'){
const voiceStart=s.indexOf('2) FULL HINDI VOICEOVER SCRIPT');
const visualStart=s.indexOf('3) DETAILED SCENE-BY-SCENE VISUAL PLAN');

let voice=s.slice(voiceStart,visualStart);
const requestedDuration=val('duration')||'5 minutes';
const durationMatch=requestedDuration.match(/\d+(?:\.\d+)?/);
const targetMinutes=durationMatch?Math.max(1,Math.min(60,Number(durationMatch[0]))):5;
const wpm=130;
const targetWords=Math.round(targetMinutes*wpm);
const re=/\[(\d{1,2}:\d{2})–(\d{1,2}:\d{2}) \| ([^\]]+)\]/g;
const matches=[...voice.matchAll(re)];
const sections=[];
for(let i=0;i<matches.length;i++){
const m=matches[i],bodyStart=m.index+m[0].length,bodyEnd=i+1<matches.length?matches[i+1].index:voice.length;
const body=voice.slice(bodyStart,bodyEnd).trim();
const words=(body.match(/[\p{L}\p{N}]+(?:['’.-][\p{L}\p{N}]+)*/gu)||[]).length;
sections.push({match:m,body,words});
}
const totalBefore=sections.reduce((n,x)=>n+x.words,0);
const ratio=Math.min(1,targetWords/Math.max(1,totalBefore));
function countWords(t){return (t.match(/[\p{L}\p{N}]+(?:['’.-][\p{L}\p{N}]+)*/gu)||[]).length}
function fitWords(text,budget){
if(countWords(text)<=budget)return text;
const sentences=text.match(/[^.!?।]+[.!?।]?/gu)||[text];
const kept=[];let used=0;
for(const sentence of sentences){
const n=countWords(sentence);
if(used+n>budget)break;
kept.push(sentence.trim());used+=n;
}
if(kept.length)return kept.join(' ');
const tokens=text.match(/\S+/g)||[];
return tokens.slice(0,budget).join(' ').replace(/[,:;—-]+$/,'')+'…';
}

const fmt=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
for(let i=0;i<sections.length;i++){
const item=sections[i],m=item.match;
const budget=i===sections.length-1?Math.max(1,targetWords-sections.slice(0,-1).reduce((n,x)=>n+x.finalWords,0)):Math.max(1,Math.floor(item.words*ratio));
const body=fitWords(item.body,budget);
const words=countWords(body);
item.finalWords=words;
const startSec=elapsed;
elapsed+=Math.max(1,Math.round(words/wpm*60));
rebuilt+=voice.slice(cursor,m.index)+'['+fmt(startSec)+'–'+fmt(elapsed)+' | '+m[3]+']\n'+body+'\n\n';
cursor=m.index+m[0].length+(item.body.length);
}
if(sections.length){
const last=sections[sections.length-1];
const finalEnd=voice.indexOf(last.body,sections[sections.length-1].match.index);
if(finalEnd>=0){

rebuilt=originalPrefix;
elapsed=0;
for(let i=0;i<sections.length;i++){
const item=sections[i],startSec=elapsed;
elapsed+=Math.max(1,Math.round(item.finalWords/wpm*60));
rebuilt+='['+fmt(startSec)+'–'+fmt(elapsed)+' | '+item.match[3]+']\n'+fitWords(item.body,item.finalWords)+'\n\n';
}
}
}
const totalWords=sections.reduce((n,x)=>n+x.finalWords,0);
const totalSeconds=Math.max(1,Math.round(totalWords/wpm*60));
s=s.slice(0,voiceStart)+rebuilt+'\n'+s.slice(visualStart);
const actualMin=(totalSeconds/60).toFixed(1);
s=s.replace(/Target length: [^\n]+/,'Requested length: '+requestedDuration+'\nEstimated voiceover: '+actualMin+' minutes ('+totalWords+' words at '+wpm+' words/min)'+(Math.abs(Number(actualMin)-targetMinutes)>0.3?'\nLENGTH NOTE: Read aloud and adjust pauses; this is an estimated duration.':''));
s=s.replace('3) DETAILED SCENE-BY-SCENE VISUAL PLAN','TIMING CHECK: Voiceover is sized to the requested word budget at '+wpm+' words per minute. Read aloud once and adjust pauses.\n\n3) DETAILED SCENE-BY-SCENE VISUAL PLAN');
const sceneStart=s.indexOf('3) DETAILED SCENE-BY-SCENE VISUAL PLAN');
const editStart=s.indexOf('4) EDITING, MUSIC & SFX',sceneStart);
if(sceneStart!==-1&&editStart>sceneStart){
let scene=s.slice(sceneStart,editStart);
const voiceRanges=[...rebuilt.matchAll(/\[(\d{1,2}:\d{2})–(\d{1,2}:\d{2}) \| ([^\]]+)\]/g)].map(m=>({start:m[1],end:m[2]}));
const sceneTimeMatches=[...scene.matchAll(/\d{1,2}:\d{2}–\d{1,2}:\d{2}/g)];
let sceneIndex=0;
scene=scene.replace(/\d{1,2}:\d{2}–\d{1,2}:\d{2}/g,()=>{
const range=voiceRanges[Math.min(sceneIndex,voiceRanges.length-1)];

}
}
